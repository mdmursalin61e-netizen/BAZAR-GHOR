
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders Management | BAZAR GHOR</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f3f5fa;
    color: #202b3c;
}

.header {
    background: #101c35;
    color: white;
    padding: 20px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
}

.header h2 { font-size: 21px; }

.header p {
    color: #b9c5d9;
    font-size: 13px;
    margin-top: 5px;
}

.container {
    padding: 30px;
    max-width: 1600px;
    margin: auto;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 22px;
}

.top h1 { font-size: 26px; }

button {
    border: none;
    padding: 10px 14px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.refresh, .details-btn {
    background: #2457d6;
    color: white;
}

.logout, .delete-btn, .reject-handoff {
    background: #e34b4b;
    color: white;
}

.save, .restore-btn, .send-handoff, .approve-handoff {
    background: #168653;
    color: white;
}

.archive-btn {
    background: #e5a126;
    color: #202b3c;
}

.search {
    width: 100%;
    max-width: 380px;
    padding: 12px;
    border: 1px solid #d5dbe6;
    border-radius: 7px;
    outline: none;
}

.tabs {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin: 18px 0;
}

.tab {
    background: #e3e8f1;
    color: #26364e;
}

.tab.active {
    background: #2457d6;
    color: white;
}

.table-box {
    background: white;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 3px 15px rgba(0,0,0,.05);
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 1250px;
    border-collapse: collapse;
}

th, td {
    padding: 13px 12px;
    border-bottom: 1px solid #edf0f5;
    text-align: left;
    font-size: 13px;
    vertical-align: middle;
}

th {
    background: #f7f8fc;
    color: #526078;
    white-space: nowrap;
}

select, .admin-note-input {
    padding: 8px;
    border: 1px solid #d5dbe6;
    border-radius: 6px;
    background: white;
    max-width: 180px;
}

.message {
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 7px;
    display: none;
}

.empty {
    text-align: center;
    padding: 35px;
    color: #778196;
}

.customer-info {
    line-height: 1.7;
    min-width: 150px;
}

.muted {
    color: #778196;
    font-size: 12px;
}

.action-buttons {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 110px;
}

.action-buttons button { width: 100%; }

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10, 20, 40, .65);
    z-index: 9999;
    padding: 20px;
    overflow-y: auto;
}

.modal-content {
    background: white;
    width: 100%;
    max-width: 1000px;
    margin: 30px auto;
    border-radius: 13px;
    padding: 25px;
    box-shadow: 0 10px 40px rgba(0,0,0,.2);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
}

.modal-header h2 { font-size: 21px; }

.close-btn {
    background: #ffe5e5;
    color: #c62828;
    font-size: 18px;
}

.detail-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 22px;
}

.detail-card {
    background: #f5f7fb;
    padding: 14px;
    border-radius: 8px;
    overflow-wrap: anywhere;
}

.detail-card p {
    color: #78819a;
    font-size: 12px;
    margin-bottom: 7px;
}

.detail-card strong { font-size: 14px; }

.address-card { grid-column: 1 / -1; }

.items-table {
    width: 100%;
    min-width: 850px;
    margin-top: 12px;
}

.items-wrapper { overflow-x: auto; }

.total-line {
    text-align: right;
    margin-top: 18px;
    font-size: 19px;
    font-weight: bold;
}

.handoff-box {
    min-width: 230px;
    padding: 10px;
    background: #f5f7fb;
    border-radius: 7px;
    line-height: 1.5;
}

.handoff-box select {
    display: block;
    width: 100%;
    max-width: none;
    margin: 8px 0;
}

.handoff-box button {
    margin: 4px 3px 0 0;
}

.handoff-status {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    text-transform: capitalize;
    background: #e3e8f1;
    color: #26364e;
}

.handoff-status.sent {
    background: #fef3c7;
    color: #92400e;
}

.handoff-status.accepted,
.handoff-status.admin_approved {
    background: #dcfce7;
    color: #166534;
}

.handoff-status.rejected,
.handoff-status.admin_rejected {
    background: #fee2e2;
    color: #991b1b;
}

/* SUPPLIER DELIVERY PROGRESS */

.delivery-panel {
    margin-top: 12px;
    padding: 12px;
    background: #eef5ff;
    border: 1px solid #cbdcf8;
    border-radius: 8px;
}

.delivery-panel h4 {
    font-size: 13px;
    margin-bottom: 10px;
    color: #173d78;
}

.delivery-status {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 20px;
    background: #dbeafe;
    color: #1d4ed8;
    font-size: 12px;
    font-weight: bold;
    text-transform: capitalize;
}

.delivery-note {
    margin-top: 9px;
    padding: 9px;
    background: white;
    border-radius: 6px;
    font-size: 12px;
    color: #334155;
    overflow-wrap: anywhere;
}

.delivery-time {
    margin-top: 8px;
    color: #64748b;
    font-size: 11px;
}

.handoff-note {
    margin-top: 8px;
    font-size: 12px;
    color: #475569;
    overflow-wrap: anywhere;
}

@media(max-width: 600px) {
    .container { padding: 15px; }
    .header { padding: 18px; }
    .top h1 { font-size: 22px; }
    .modal-content { padding: 16px; }
    .detail-grid { grid-template-columns: 1fr; }
    .address-card { grid-column: auto; }
}
</style>
</head>

<body>

<header class="header">
    <div>
        <h2>BAZAR GHOR</h2>
        <p>Bangladesh | Admin Panel</p>
    </div>
    <button class="logout" onclick="logout()">Logout</button>
</header>

<main class="container">

    <div class="top">
        <div>
            <h1>Orders Management</h1>
            <p>View, save, archive, restore and manage customer orders.</p>
        </div>

        <button class="refresh" onclick="loadOrders()">
            Refresh Orders
        </button>
    </div>

    <div id="message" class="message"></div>

    <input
        type="search"
        id="search"
        class="search"
        placeholder="Search order, customer name, phone..."
        oninput="filterOrders()"
    >

    <div class="tabs">
        <button id="activeTab" class="tab active" onclick="switchTab(false)">
            Active Orders
        </button>

        <button id="archivedTab" class="tab" onclick="switchTab(true)">
            Archived Orders
        </button>
    </div>

    <section class="table-box">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Order Number</th>
                    <th>Customer</th>
                    <th>Phone</th>
                    <th>Total</th>
                    <th>Order Status</th>
                    <th>Payment Status</th>
                    <th>Payment Method</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="ordersTable">
                <tr>
                    <td colspan="10" class="empty">Loading orders...</td>
                </tr>
            </tbody>
        </table>
    </section>

</main>

<div class="modal" id="detailsModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Order Details & Supplier Handover</h2>
            <button class="close-btn" onclick="closeDetails()">✕</button>
        </div>

        <div id="detailsContent">Loading details...</div>
    </div>
</div>

<script>
let allOrders = [];
let showingArchived = false;
let supplierHandoffs = [];

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function showMessage(message, success = false) {
    const box = document.getElementById("message");

    box.textContent = message;
    box.style.display = "block";
    box.style.background = success ? "#d9f7e7" : "#ffe0e0";
    box.style.color = success ? "#126b3e" : "#a52222";

    window.scrollTo({ top: 0, behavior: "smooth" });
}

function formatDate(value) {
    if (!value) return "-";

    const date = new Date(value);

    return Number.isNaN(date.getTime())
        ? "-"
        : date.toLocaleString();
}

function makeOptions(current, choices) {
    return choices.map(value => `
        <option value="${escapeHTML(value)}"
            ${value === current ? "selected" : ""}>
            ${escapeHTML(value)}
        </option>
    `).join("");
}

async function requestJSON(url, options = {}) {
    const response = await fetch(url, {
        credentials: "same-origin",
        cache: "no-store",
        ...options,
        headers: {
            ...(options.headers || {})
        }
    });

    let data;

    try {
        data = await response.json();
    } catch {
        throw new Error("Invalid server response.");
    }

    if (!response.ok || data.success === false) {
        throw new Error(data.message || "Request failed.");
    }

    return data;
}

function switchTab(archived) {
    showingArchived = archived;

    document.getElementById("activeTab").classList.toggle(
        "active", !archived
    );

    document.getElementById("archivedTab").classList.toggle(
        "active", archived
    );

    loadOrders();
}

async function loadOrders() {
    const table = document.getElementById("ordersTable");

    table.innerHTML = `
        <tr><td colspan="10" class="empty">Loading orders...</td></tr>
    `;

    try {
        const data = await requestJSON(
            `/api/admin/orders?archived=${showingArchived}`
        );

        allOrders = Array.isArray(data.orders) ? data.orders : [];

        filterOrders();

    } catch (error) {
        table.innerHTML = `
            <tr>
                <td colspan="10" class="empty">
                    ${escapeHTML(error.message)}
                </td>
            </tr>
        `;
    }
}

function renderOrders(orders) {
    const table = document.getElementById("ordersTable");

    if (!orders.length) {
        table.innerHTML = `
            <tr>
                <td colspan="10" class="empty">
                    ${showingArchived
                        ? "No archived orders found."
                        : "No active orders found."}
                </td>
            </tr>
        `;
        return;
    }

    table.innerHTML = orders.map(order => {
        const id = Number(order.id);

        const activeActions = `
            <button class="details-btn"
                onclick="viewDetails(${id})">
                View Details / Supplier
            </button>

            <button class="save"
                onclick="updateOrder(${id})">
                Save
            </button>

            <button class="archive-btn"
                onclick="archiveOrder(${id})">
                Archive
            </button>
        `;

        const archivedActions = `
            <button class="details-btn"
                onclick="viewDetails(${id})">
                View Details
            </button>

            <button class="restore-btn"
                onclick="restoreOrder(${id})">
                Restore
            </button>

            <button class="delete-btn"
                onclick="deleteOrder(${id})">
                Delete Permanently
            </button>
        `;

        return `
            <tr>
                <td>${escapeHTML(order.id)}</td>

                <td>
                    <strong>${escapeHTML(order.order_number || "-")}</strong>
                </td>

                <td>
                    <div class="customer-info">
                        ${escapeHTML(order.customer_name || "Unknown")}
                        <div class="muted">
                            ${escapeHTML(order.customer_email || "")}
                        </div>
                    </div>
                </td>

                <td>${escapeHTML(order.customer_phone || "-")}</td>

                <td>৳${escapeHTML(order.total_amount ?? "0")}</td>

                <td>
                    ${
                        showingArchived
                        ? escapeHTML(order.status || "-")
                        : `<select id="status-${id}">
                            ${makeOptions(order.status, [
                                "pending", "confirmed", "processing",
                                "shipped", "delivered", "cancelled"
                            ])}
                           </select>`
                    }
                </td>

                <td>
                    ${
                        showingArchived
                        ? escapeHTML(order.payment_status || "-")
                        : `<select id="payment-${id}">
                            ${makeOptions(order.payment_status, [
                                "unpaid", "pending", "paid",
                                "failed", "refunded"
                            ])}
                           </select>`
                    }
                </td>

                <td>${escapeHTML(
                    (order.payment_method || "-").toUpperCase()
                )}</td>

                <td>${escapeHTML(formatDate(order.created_at))}</td>

                <td>
                    <div class="action-buttons">
                        ${showingArchived ? archivedActions : activeActions}
                    </div>
                </td>
            </tr>
        `;
    }).join("");
}

// LOAD ALL SUPPLIER HANDOFF RECORDS
async function loadSupplierHandoffs() {
    const data = await requestJSON(
        "/api/admin/supplier-order-handoffs"
    );

    supplierHandoffs = Array.isArray(data.handoffs)
        ? data.handoffs
        : [];

    return supplierHandoffs;
}

// OPEN ORDER DETAILS
async function viewDetails(id) {
    const modal = document.getElementById("detailsModal");
    const content = document.getElementById("detailsContent");

    const order = allOrders.find(
        item => Number(item.id) === Number(id)
    );

    if (!order) {
        showMessage("Order not found.");
        return;
    }

    modal.style.display = "block";
    content.innerHTML = "Loading order details...";

    try {
        const [itemsData] = await Promise.all([
            requestJSON(`/api/admin/orders/${id}/items`),
            loadSupplierHandoffs()
        ]);

        const items = Array.isArray(itemsData.items)
            ? itemsData.items
            : [];

        const itemRows = items.length
            ? items.map(item => `
                <tr>
                    <td>${escapeHTML(item.product_name)}</td>
                    <td>৳${escapeHTML(item.unit_price)}</td>
                    <td>${escapeHTML(item.quantity)}</td>
                    <td>৳${escapeHTML(item.subtotal)}</td>
                    <td>
                        <div class="handoff-box"
                             id="supplier-box-${Number(item.id)}">
                            Loading supplier options...
                        </div>
                    </td>
                </tr>
            `).join("")
            : `
                <tr>
                    <td colspan="5" class="empty">
                        No product items found.
                    </td>
                </tr>
            `;

        content.innerHTML = `
            <div class="detail-grid">
                <div class="detail-card">
                    <p>Order Number</p>
                    <strong>${escapeHTML(order.order_number)}</strong>
                </div>

                <div class="detail-card">
                    <p>Order ID</p>
                    <strong>${escapeHTML(order.id)}</strong>
                </div>

                <div class="detail-card">
                    <p>Customer Name</p>
                    <strong>${escapeHTML(order.customer_name || "-")}</strong>
                </div>

                <div class="detail-card">
                    <p>Phone Number</p>
                    <strong>${escapeHTML(order.customer_phone || "-")}</strong>
                </div>

                <div class="detail-card">
                    <p>Email</p>
                    <strong>${escapeHTML(order.customer_email || "-")}</strong>
                </div>

                <div class="detail-card">
                    <p>Payment Method</p>
                    <strong>${escapeHTML(
                        (order.payment_method || "-").toUpperCase()
                    )}</strong>
                </div>

                <div class="detail-card">
                    <p>Payment Status</p>
                    <strong>${escapeHTML(order.payment_status || "-")}</strong>
                </div>

                <div class="detail-card">
                    <p>Transaction ID</p>
                    <strong>${escapeHTML(
                        order.payment_reference || "Not provided"
                    )}</strong>
                </div>

                <div class="detail-card address-card">
                    <p>Delivery Address</p>
                    <strong>${escapeHTML(order.delivery_address || "-")}</strong>
                </div>

                <div class="detail-card">
                    <p>Order Status</p>
                    <strong>${escapeHTML(order.status || "-")}</strong>
                </div>

                <div class="detail-card">
                    <p>Order Date</p>
                    <strong>${escapeHTML(formatDate(order.created_at))}</strong>
                </div>
            </div>

            <h3>Ordered Products & Supplier Assignment</h3>

            <p class="muted" style="margin-top:8px;">
                প্রতিটি পণ্যের জন্য Admin একজন Supplier নির্বাচন করে পাঠাতে পারবেন।
            </p>

            <div class="items-wrapper">
                <table class="items-table">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Subtotal</th>
                            <th>Supplier Handover</th>
                        </tr>
                    </thead>
                    <tbody>${itemRows}</tbody>
                </table>
            </div>

            <div class="total-line">
                Total: ৳${escapeHTML(order.total_amount ?? "0")}
            </div>
        `;

        for (const item of items) {
            loadSupplierOptions(order.id, item);
        }

    } catch (error) {
        content.innerHTML = `
            <p class="empty">${escapeHTML(error.message)}</p>
        `;
    }
}

// LOAD AVAILABLE SUPPLIERS FOR ONE ORDER ITEM
async function loadSupplierOptions(orderId, item) {
    const box = document.getElementById(
        `supplier-box-${Number(item.id)}`
    );

    if (!box) return;

    try {
        const data = await requestJSON(
            `/api/admin/orders/${encodeURIComponent(orderId)}` +
            `/items/${encodeURIComponent(item.id)}/supplier-options`
        );

        const options = Array.isArray(data.suppliers)
            ? data.suppliers
            : Array.isArray(data.options)
                ? data.options
                : Array.isArray(data.supplier_options)
                    ? data.supplier_options
                    : [];

        const existing = supplierHandoffs.find(
            handoff =>
                Number(handoff.order_item_id) === Number(item.id)
        );

        if (existing) {
            renderExistingHandoff(box, existing);
            return;
        }

        if (showingArchived) {
            box.textContent =
                "Archived order: no new supplier assignment.";
            return;
        }

        if (!options.length) {
            box.textContent =
                "No approved and available supplier found.";
            return;
        }

        const select = document.createElement("select");
        select.id = `supplier-select-${Number(item.id)}`;

        const first = document.createElement("option");
        first.value = "";
        first.textContent = "Select Supplier";
        select.appendChild(first);

        options.forEach(supplier => {
            const option = document.createElement("option");

            option.value = supplier.supplier_product_id;

            option.textContent =
                (supplier.supplier_name || "Supplier") +
                (supplier.business_name
                    ? " - " + supplier.business_name
                    : "") +
                " | Stock: " +
                (supplier.stock_available ?? "N/A");

            select.appendChild(option);
        });

        const sendButton = document.createElement("button");
        sendButton.type = "button";
        sendButton.className = "send-handoff";
        sendButton.textContent = "Send to Supplier";

        sendButton.addEventListener("click", () => {
            sendToSupplier(
                orderId,
                item.id,
                select.value,
                sendButton
            );
        });

        box.replaceChildren(select, sendButton);

    } catch (error) {
        box.textContent =
            "Supplier options error: " + error.message;
    }
}

// DISPLAY DELIVERY PROGRESS INFORMATION
function renderDeliveryProgress(box, handoff) {
    const panel = document.createElement("div");
    panel.className = "delivery-panel";

    const heading = document.createElement("h4");
    heading.textContent = "Supplier Delivery Progress";

    const status = document.createElement("div");
    status.className = "delivery-status";

    const currentStatus = String(
        handoff.delivery_status || "not_started"
    ).replaceAll("_", " ");

    status.textContent = "Status: " + currentStatus;

    panel.append(heading, status);

    const note = document.createElement("div");
    note.className = "delivery-note";

    if (handoff.delivery_note) {
        note.textContent =
            "Supplier Update: " + handoff.delivery_note;
    } else {
        note.textContent = "No delivery update note provided.";
    }

    panel.appendChild(note);

    const updated = document.createElement("p");
    updated.className = "delivery-time";

    updated.textContent = handoff.delivery_updated_at
        ? "Last Updated: " + formatDate(handoff.delivery_updated_at)
        : "No delivery update time available.";

    panel.appendChild(updated);

    box.appendChild(panel);
}

// DISPLAY EXISTING HANDOFF AND SUPPLIER RESPONSE
function renderExistingHandoff(box, handoff) {
    box.replaceChildren();

    const supplierName = document.createElement("strong");
    supplierName.textContent =
        handoff.supplier_name || "Assigned Supplier";

    const status = document.createElement("div");
    status.style.marginTop = "7px";

    const badge = document.createElement("span");
    badge.className =
        "handoff-status " + (handoff.status || "sent");

    badge.textContent =
        String(handoff.status || "sent").replaceAll("_", " ");

    status.appendChild(badge);

    box.append(supplierName, status);

    if (handoff.supplier_response_note) {
        const response = document.createElement("p");
        response.className = "handoff-note";
        response.textContent =
            "Supplier response: " + handoff.supplier_response_note;

        box.appendChild(response);
    }

    if (handoff.admin_note) {
        const note = document.createElement("p");
        note.className = "handoff-note";
        note.textContent = "Admin note: " + handoff.admin_note;

        box.appendChild(note);
    }

    // SHOW DELIVERY PROGRESS AFTER ADMIN APPROVAL
    if (handoff.status === "admin_approved") {
        renderDeliveryProgress(box, handoff);
    }

    if (
        handoff.status === "accepted" ||
        handoff.status === "rejected"
    ) {
        const noteInput = document.createElement("input");
        noteInput.type = "text";
        noteInput.className = "admin-note-input";
        noteInput.id = `review-note-${Number(handoff.id)}`;
        noteInput.placeholder = "Admin review note (optional)";
        noteInput.style.width = "100%";
        noteInput.style.marginTop = "9px";

        const reviewButton = document.createElement("button");
        reviewButton.type = "button";

        if (handoff.status === "accepted") {
            reviewButton.className = "approve-handoff";
            reviewButton.textContent = "Final Approve";
        } else {
            reviewButton.className = "reject-handoff";
            reviewButton.textContent = "Final Reject";
        }

        reviewButton.addEventListener("click", () => {
            const decision =
                handoff.status === "accepted"
                    ? "approved"
                    : "rejected";

            reviewHandoff(
                handoff.id,
                decision,
                noteInput.value,
                reviewButton
            );
        });

        box.append(noteInput, reviewButton);

    } else if (handoff.status === "sent") {
        const waiting = document.createElement("p");
        waiting.className = "handoff-note";
        waiting.textContent =
            "Waiting for Supplier response.";

        box.appendChild(waiting);

    } else {
        const completed = document.createElement("p");
        completed.className = "handoff-note";
        completed.textContent =
            "Admin review completed.";

        box.appendChild(completed);
    }
}

// SEND ORDER ITEM TO SELECTED SUPPLIER
async function sendToSupplier(orderId, itemId, supplierProductId, button) {
    if (!supplierProductId) {
        showMessage("Please select a Supplier first.");
        return;
    }

    const confirmed = confirm(
        "Send this order item to the selected Supplier?"
    );

    if (!confirmed) return;

    button.disabled = true;
    button.textContent = "Sending...";

    try {
        const data = await requestJSON(
            `/api/admin/orders/${encodeURIComponent(orderId)}` +
            `/items/${encodeURIComponent(itemId)}/handoff`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    supplier_product_id: Number(supplierProductId)
                })
            }
        );

        showMessage(
            data.message || "Order sent to Supplier successfully.",
            true
        );

        await viewDetails(orderId);

    } catch (error) {
        showMessage(error.message);
        button.disabled = false;
        button.textContent = "Send to Supplier";
    }
}

// ADMIN FINAL REVIEW OF SUPPLIER RESPONSE
async function reviewHandoff(handoffId, decision, note, button) {
    const actionText = decision === "approved"
        ? "approve"
        : "reject";

    const confirmed = confirm(
        `Are you sure you want to ${actionText} this Supplier response?`
    );

    if (!confirmed) return;

    button.disabled = true;
    button.textContent = "Saving...";

    try {
        const data = await requestJSON(
            `/api/admin/supplier-order-handoffs/` +
            `${encodeURIComponent(handoffId)}/review`,
            {
                method: "PATCH",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    decision,
                    note: String(note || "").trim()
                })
            }
        );

        showMessage(
            data.message || "Supplier response reviewed successfully.",
            true
        );

        await loadSupplierHandoffs();

        const currentOrder = getCurrentModalOrder();

        if (currentOrder) {
            await viewDetails(currentOrder.id);
        }

    } catch (error) {
        showMessage(error.message);
        button.disabled = false;
        button.textContent =
            decision === "approved" ? "Final Approve" : "Final Reject";
    }
}

function getCurrentModalOrder() {
    const content = document.getElementById("detailsContent");
    const heading = content.querySelector(".detail-card strong");

    if (!heading) return null;

    const orderNumber = heading.textContent;

    return allOrders.find(
        order => String(order.order_number) === String(orderNumber)
    ) || null;
}

function closeDetails() {
    document.getElementById("detailsModal").style.display = "none";
}

document.getElementById("detailsModal").addEventListener("click", event => {
    if (event.target.id === "detailsModal") {
        closeDetails();
    }
});

async function updateOrder(id) {
    const statusElement = document.getElementById(`status-${id}`);
    const paymentElement = document.getElementById(`payment-${id}`);

    if (!statusElement || !paymentElement) return;

    try {
        const data = await requestJSON(`/api/admin/orders/${id}/status`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                status: statusElement.value,
                payment_status: paymentElement.value
            })
        });

        showMessage(data.message || "Order updated successfully!", true);
        await loadOrders();

    } catch (error) {
        showMessage(error.message);
    }
}

async function archiveOrder(id) {
    const order = allOrders.find(item => Number(item.id) === Number(id));

    if (!order) return;

    const confirmed = confirm(
        `Archive order ${order.order_number}?\n\nIt will disappear from Active Orders. You can restore it later.`
    );

    if (!confirmed) return;

    await performOrderAction(
        `/api/admin/orders/${id}/archive`,
        "PATCH",
        "Order archived successfully."
    );
}

async function restoreOrder(id) {
    const order = allOrders.find(item => Number(item.id) === Number(id));

    if (!order) return;

    const confirmed = confirm(
        `Restore order ${order.order_number} to Active Orders?`
    );

    if (!confirmed) return;

    await performOrderAction(
        `/api/admin/orders/${id}/restore`,
        "PATCH",
        "Order restored successfully."
    );
}

async function deleteOrder(id) {
    const order = allOrders.find(item => Number(item.id) === Number(id));

    if (!order) return;

    const confirmed = confirm(
        `WARNING!\n\nPermanently delete order ${order.order_number}?\n\nThis cannot be undone. Its saved order items and related supplier handoffs will also be deleted.`
    );

    if (!confirmed) return;

    const secondConfirmation = confirm(
        "Are you absolutely sure? This deletion is permanent."
    );

    if (!secondConfirmation) return;

    await performOrderAction(
        `/api/admin/orders/${id}`,
        "DELETE",
        "Archived order permanently deleted."
    );
}

async function performOrderAction(url, method, successMessage) {
    try {
        const data = await requestJSON(url, { method });

        showMessage(data.message || successMessage, true);
        await loadOrders();

    } catch (error) {
        showMessage(error.message);
    }
}

function filterOrders() {
    const query = document.getElementById("search")
        .value.trim().toLowerCase();

    const filtered = allOrders.filter(order => {
        return [
            order.order_number,
            order.customer_name,
            order.customer_phone,
            order.customer_email,
            order.customer_id,
            order.id
        ].some(value =>
            String(value ?? "").toLowerCase().includes(query)
        );
    });

    renderOrders(filtered);
}

async function logout() {
    try {
        await fetch("/api/admin/logout", {
            method: "POST",
            credentials: "same-origin"
        });
    } finally {
        window.location.href = "/pages/admin.html";
    }
}

loadOrders();
</script>
