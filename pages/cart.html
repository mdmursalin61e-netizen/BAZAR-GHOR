
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart | BAZAR GHOR</title>
    <meta name="description" content="Review your shopping cart at BAZAR GHOR.">

    <link rel="stylesheet" href="../assets/css/style.css">

    <style>
        :root {
            --primary: #10233f;
            --secondary: #1d4e89;
            --gold: #e6ad45;
            --light: #f3f6fb;
            --text: #253247;
            --green: #087a45;
            --danger: #dc3545;
        }

        body {
            background: #f5f7fb;
            color: var(--text);
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .cart-header {
            background: var(--primary);
            color: white;
            padding: 18px 20px;
        }

        .cart-header-inner {
            max-width: 1100px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
        }

        .logo-mark {
            width: 43px;
            height: 43px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--gold);
            color: var(--primary);
            border-radius: 10px;
            font-size: 25px;
            font-weight: 900;
        }

        .brand-name {
            font-size: 21px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .brand-tagline {
            display: block;
            font-size: 11px;
            color: #d7dfeb;
            margin-top: 3px;
        }

        .home-link {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .home-link:hover {
            color: var(--gold);
        }

        .cart-page {
            max-width: 1100px;
            margin: 45px auto;
            padding: 20px;
            min-height: 55vh;
        }

        .cart-heading {
            text-align: center;
            margin-bottom: 35px;
        }

        .cart-heading h1 {
            color: var(--primary);
            font-size: 34px;
            margin-bottom: 8px;
        }

        .cart-heading p {
            color: #68758a;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 22px;
            margin-bottom: 16px;
            border: 1px solid #e1e7f0;
            border-radius: 14px;
            background: white;
            box-shadow: 0 4px 15px rgba(16, 35, 63, 0.05);
        }

        .cart-item img {
            width: 105px;
            height: 105px;
            object-fit: contain;
            border-radius: 10px;
            background: var(--light);
            padding: 5px;
        }

        .cart-info {
            flex: 1;
            min-width: 0;
        }

        .cart-info h3 {
            margin: 0 0 10px;
            color: var(--primary);
            font-size: 19px;
        }

        .cart-price {
            font-weight: bold;
            color: var(--green);
            font-size: 17px;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 13px;
            margin-top: 13px;
        }

        .quantity-controls button {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 7px;
            background: #eaf0f8;
            color: var(--primary);
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .quantity-controls button:hover {
            background: var(--gold);
        }

        .quantity-controls strong {
            min-width: 20px;
            text-align: center;
        }

        .remove-button {
            border: none;
            padding: 10px 16px;
            border-radius: 7px;
            cursor: pointer;
            background: #fff0f0;
            color: var(--danger);
            font-weight: bold;
        }

        .remove-button:hover {
            background: var(--danger);
            color: white;
        }

        .cart-summary {
            max-width: 420px;
            margin: 30px 0 0 auto;
            padding: 25px;
            border-radius: 14px;
            background: white;
            border: 1px solid #e1e7f0;
            box-shadow: 0 4px 18px rgba(16, 35, 63, 0.06);
        }

        .cart-summary h2 {
            color: var(--primary);
            margin-top: 0;
        }

        .cart-total {
            font-size: 25px;
            font-weight: bold;
            color: var(--green);
            margin: 18px 0;
        }

        .checkout-button,
        .continue-button {
            display: inline-block;
            padding: 13px 20px;
            border-radius: 8px;
            text-decoration: none;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .checkout-button {
            background: var(--primary);
            color: white;
            width: 100%;
            border: none;
            font-size: 16px;
        }

        .checkout-button:hover {
            background: var(--secondary);
        }

        .continue-button {
            background: #eaf0f8;
            color: var(--primary);
            margin-top: 18px;
        }

        .continue-button:hover {
            background: var(--gold);
        }

        .empty-cart {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border: 1px solid #e1e7f0;
            border-radius: 14px;
        }

        .empty-cart h2 {
            color: var(--primary);
            margin-bottom: 10px;
        }

        .empty-cart p {
            color: #68758a;
        }

        .cart-footer {
            text-align: center;
            padding: 22px;
            background: var(--primary);
            color: #d7dfeb;
            font-size: 13px;
        }

        .cart-footer strong {
            color: var(--gold);
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 600px) {
            .cart-page {
                margin: 25px auto;
                padding: 14px;
            }

            .cart-heading h1 {
                font-size: 27px;
            }

            .cart-item {
                flex-wrap: wrap;
                gap: 14px;
                padding: 15px;
            }

            .cart-item img {
                width: 85px;
                height: 85px;
            }

            .cart-info {
                flex: 1;
            }

            .remove-button {
                width: 100%;
            }

            .cart-summary {
                max-width: 100%;
            }

            .brand-name {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <header class="cart-header">
        <div class="cart-header-inner">

            <a href="/" class="brand">
                <span class="logo-mark">M</span>

                <span>
                    <span class="brand-name">BAZAR GHOR</span>
                    <span class="brand-tagline">বাজার ঘর | Online Shopping</span>
                </span>
            </a>

            <a href="/" class="home-link">Home</a>

        </div>
    </header>

    <main class="cart-page">

        <div class="cart-heading">
            <h1>My Shopping Cart</h1>
            <p>Review your selected products before checkout.</p>
        </div>

        <div id="cartItems"></div>

        <div id="cartSummary" class="cart-summary" hidden>
            <h2>Order Summary</h2>

            <p id="totalItems">Total Items: 0</p>

            <p class="cart-total" id="totalPrice">
                Total: ৳0.00
            </p>

            <button
                type="button"
                class="checkout-button"
                onclick="goToCheckout()"
            >
                Proceed to Checkout
            </button>
        </div>

        <div style="text-align:center;">
            <a href="/#products" class="continue-button">
                Continue Shopping
            </a>
        </div>

    </main>

    <footer class="cart-footer">
        © <span id="currentYear"></span>
        <strong>BAZAR GHOR</strong>.
        All Rights Reserved.
    </footer>

    <script>
        const CART_KEY = "eliteSphereCart";

        const cartItems = document.getElementById("cartItems");
        const cartSummary = document.getElementById("cartSummary");

        document.getElementById("currentYear").textContent =
            new Date().getFullYear();

        function getCart() {
            try {
                const cart = JSON.parse(
                    localStorage.getItem(CART_KEY) || "[]"
                );

                return Array.isArray(cart) ? cart : [];

            } catch (error) {
                return [];
            }
        }

        function saveCart(cart) {
            localStorage.setItem(CART_KEY, JSON.stringify(cart));
        }

        function escapeHTML(value) {
            return String(value ?? "").replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            })[char]);
        }

        function formatPrice(price) {
            return "৳" + Number(price || 0).toFixed(2);
        }

        function renderCart() {
            const cart = getCart();

            if (cart.length === 0) {

                cartItems.innerHTML = `
                    <div class="empty-cart">
                        <h2>Your Cart is Empty!</h2>

                        <p>
                            You have not added any products yet.
                        </p>

                        <a href="/#products" class="continue-button">
                            Start Shopping
                        </a>
                    </div>
                `;

                cartSummary.hidden = true;
                return;
            }

            let total = 0;
            let itemCount = 0;

            cartItems.innerHTML = cart.map((item, index) => {

                const price = Number(item.price) || 0;

                const quantity = Math.max(
                    1,
                    Number(item.quantity) || 1
                );

                const subtotal = price * quantity;

                total += subtotal;
                itemCount += quantity;

                const image = item.image_url || "";

                const imageHTML = image
                    ? `
                        <img
                            src="${escapeHTML(image)}"
                            alt="${escapeHTML(item.name)}"
                            onerror="this.style.display='none'"
                        >
                    `
                    : "";

                return `
                    <div class="cart-item">

                        ${imageHTML}

                        <div class="cart-info">

                            <h3>
                                ${escapeHTML(item.name)}
                            </h3>

                            <p class="cart-price">
                                ${formatPrice(price)}
                            </p>

                            <div class="quantity-controls">

                                <button
                                    type="button"
                                    onclick="changeQuantity(${index}, -1)"
                                    aria-label="Decrease quantity"
                                >
                                    −
                                </button>

                                <strong>${quantity}</strong>

                                <button
                                    type="button"
                                    onclick="changeQuantity(${index}, 1)"
                                    aria-label="Increase quantity"
                                >
                                    +
                                </button>

                            </div>

                            <p>
                                Subtotal:
                                <strong>${formatPrice(subtotal)}</strong>
                            </p>

                        </div>

                        <button
                            type="button"
                            class="remove-button"
                            onclick="removeItem(${index})"
                        >
                            Remove
                        </button>

                    </div>
                `;

            }).join("");

            document.getElementById("totalItems").textContent =
                "Total Items: " + itemCount;

            document.getElementById("totalPrice").textContent =
                "Total: " + formatPrice(total);

            cartSummary.hidden = false;
        }

        function changeQuantity(index, amount) {

            const cart = getCart();
            const item = cart[index];

            if (!item) return;

            const currentQuantity =
                Math.max(1, Number(item.quantity) || 1);

            const newQuantity = currentQuantity + amount;

            if (newQuantity < 1) return;

            const stock = Number(item.stock_quantity);

            if (
                amount > 0 &&
                Number.isFinite(stock) &&
                stock >= 0 &&
                newQuantity > stock
            ) {
                alert("Sorry! Not enough stock available.");
                return;
            }

            item.quantity = newQuantity;

            saveCart(cart);
            renderCart();
        }

        function removeItem(index) {

            const cart = getCart();

            if (!cart[index]) return;

            cart.splice(index, 1);

            saveCart(cart);
            renderCart();
        }

        function goToCheckout() {

            const cart = getCart();

            if (cart.length === 0) {
                alert("Your cart is empty.");
                return;
            }

            // Open the homepage checkout section.
            window.location.href = "/#checkout";
        }

        renderCart();
    </script>

</body>
</html>
