
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration | ELITE SPHERE GROUP</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f1f5f9;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h2 {
            color: #172554;
            font-size: 24px;
        }

        .logo p {
            color: #64748b;
            margin-top: 7px;
            font-size: 13px;
        }

        h3 {
            color: #1e293b;
            margin-bottom: 22px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #1d4ed8;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1e40af;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .success {
            color: #15803d;
        }

        .error {
            color: #dc2626;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            <h2>ELITE SPHERE GROUP</h2>
            <p>Bangladesh | Customer Registration</p>
        </div>

        <h3>Create Your Account</h3>

        <form id="registerForm">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    maxlength="150"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    maxlength="255"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    maxlength="30"
                    required
                >
            </div>

            <button type="submit" id="registerButton">
                Register Now
            </button>

            <div id="message" role="status" aria-live="polite"></div>

        </form>

        <div class="footer">
            © 2026 ELITE SPHERE GROUP. All Rights Reserved.
        </div>

    </div>

    <script>
        const registerForm = document.getElementById("registerForm");
        const registerButton = document.getElementById("registerButton");
        const message = document.getElementById("message");

        registerForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            message.textContent = "";
            message.className = "";

            registerButton.disabled = true;
            registerButton.textContent = "Registering...";

            const customerData = {
                name: document.getElementById("name").value.trim(),
                email: document.getElementById("email").value.trim(),
                phone: document.getElementById("phone").value.trim()
            };

            try {
                const response = await fetch("/api/customers/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(customerData)
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.message || "Registration failed.");
                }

                message.textContent =
                    "Registration successful! Welcome to ELITE SPHERE GROUP.";

                message.className = "success";

                registerForm.reset();

            } catch (error) {
                message.textContent = error.message;
                message.className = "error";

            } finally {
                registerButton.disabled = false;
                registerButton.textContent = "Register Now";
            }
        });
    </script>

</body>
</html>
